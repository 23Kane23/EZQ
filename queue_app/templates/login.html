<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — QueueApp</title>
    <!-- Подключаем стильный характерный шрифт Cabinet Grotesk -->
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8fafc;
            color: #0f172a;
            position: relative;
            overflow: hidden;
            padding: 24px;
        }

        /* --- ЧЕЛО ВЕЧКИ И ЭЛЕМЕНТЫ ОЧЕРЕДИ НА ФОНЕ (ЧЁТКО ПО БОКАМ) --- */
        .bg-illustration {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* --- КАРТОЧКА ВХОДА --- */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #0f172a;
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-badge {
            background: #0d9488;
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 6px 16px rgba(13, 148, 136, 0.25);
        }

        .login-card {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 28px;
            padding: 40px 36px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.06);
        }

        h2 {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: #0f172a;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px 16px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 0.98rem;
            font-family: inherit;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            background: #ffffff;
            border-color: #0d9488;
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.12);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            background: #0d9488;
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Cabinet Grotesk', sans-serif;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: 0 10px 20px -4px rgba(13, 148, 136, 0.3);
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: #0f766e;
            transform: translateY(-1px);
            box-shadow: 0 12px 24px -4px rgba(13, 148, 136, 0.4);
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: #ef4444;
            padding: 11px 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .footer-text a {
            color: #0d9488;
            font-weight: 700;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Векторный светлый фон с фигурками людей в очереди -->
    <svg class="bg-illustration" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" fill="none">
        <!-- Пунктирная траектория очереди через весь экран -->
        <path d="M 100 500 Q 350 220 700 450 T 1300 350" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.35"/>

        <!-- СЛЕВА: Человечки в очереди -->
        <g transform="translate(120, 320)">
            <!-- Человек 1 (Акцентный бирюзовый) -->
            <circle cx="50" cy="40" r="22" fill="#0d9488"/>
            <path d="M 22 105 C 22 70, 78 70, 78 105 L 72 160 L 28 160 Z" fill="#0d9488"/>
            <!-- Иконка талона над ним -->
            <rect x="35" y="-15" width="30" height="20" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
            <line x1="42" y1="-5" x2="58" y2="-5" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>

            <!-- Человек 2 (Серый, сзади) -->
            <circle cx="-30" cy="70" r="18" fill="#cbd5e1"/>
            <path d="M -52 125 C -52 95, -8 95, -8 125 L -13 175 L -47 175 Z" fill="#cbd5e1"/>
        </g>

        <!-- СПРАВА: Человечек и стойка виртуальной очереди -->
        <g transform="translate(1120, 280)">
            <!-- Терминал очереди -->
            <rect x="80" y="20" width="70" height="130" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
            <rect x="92" y="36" width="46" height="28" rx="6" fill="#0d9488" opacity="0.85"/>
            <rect x="98" y="80" width="34" height="6" rx="3" fill="#e2e8f0"/>

            <!-- Человек у терминала -->
            <circle cx="20" cy="60" r="20" fill="#0284c7"/>
            <path d="M -5 120 C -5 90, 45 90, 45 120 L 40 170 L 0 170 Z" fill="#0284c7"/>
        </g>

        <!-- Мягкие круги-акценты на заднем плане -->
        <circle cx="200" cy="180" r="90" fill="#ccfbf1" opacity="0.4"/>
        <circle cx="1250" cy="650" r="110" fill="#e0f2fe" opacity="0.5"/>
    </svg>

    <div class="login-wrapper">
        <!-- Логотип QueueApp -->
        <div class="brand-logo">
            <a href="{% url 'home' %}" class="logo-link">
                <div class="logo-badge">⚡</div>
                QueueApp
            </a>
        </div>

        <!-- Карточка входа -->
        <div class="login-card">
            <h2>Вход в кабинет</h2>

            {% if form.errors %}
                <div class="error-message">
                    Неверный логин или пароль
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Логин</label>
                    <input type="text" name="username" id="id_username" required autofocus placeholder="Имя пользователя">
                </div>

                <div class="form-group">
                    <label for="id_password">Пароль</label>
                    <input type="password" name="password" id="id_password" required placeholder="Пароль">
                </div>

                <button type="submit" class="btn-submit">Войти</button>
            </form>

            <div class="footer-text">
                Ещё нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
            </div>
        </div>
    </div>

</body>
</html>
